name: Build PyTorch3D Wheels (Windows)

# Builds PyTorch3D wheels for Windows across a full matrix of PyTorch
# versions x CUDA versions that you supply as JSON lists. One GitHub
# release is created/reused PER (pytorch version, cuda version) combo,
# since that's the meaningful unit of compatibility here - the pytorch3d
# package version itself is already embedded in the wheel filename
# (setup.py reads it from pytorch3d/__init__.py), so it doesn't need to
# be part of the release tag.
#
# IMPORTANT CAVEATS (read before running):
# 1. PyTorch3D's official INSTALL.md only lists support up to PyTorch 2.4.1
#    and does not mention CUDA 13 at all, so building against CUDA 13.x is
#    untested territory as far as upstream is concerned - it may just
#    work, or it may need patching (see caveat 2).
# 2. PyTorch3D's setup.py sometimes needs small source patches to build
#    against newer PyTorch/CUDA combinations (the upstream INSTALL.md notes
#    this too: "changes to some PyTorch headers may be needed"). This
#    workflow does NOT attempt to auto-patch anything - if the build fails
#    with a compile error, that's the next thing to look at, and the
#    "patch-command" input below is provided as a hook for exactly this.
# 3. Windows GitHub-hosted runners come with VS2022 preinstalled; this
#    workflow just activates the x64 dev environment on top of it rather
#    than installing Build Tools from scratch.
# 4. The build uses `pip wheel --no-build-isolation`, because PyTorch3D's
#    setup.py imports torch directly at build time. Build isolation would
#    create a clean venv without torch installed and the build would fail
#    with "ModuleNotFoundError: No module named 'torch'". This means torch
#    must already be installed in the runner's environment before the
#    wheel step runs, which the "Install PyTorch" step handles.

on:
  workflow_dispatch:
    inputs:
      pytorch3d-ref:
        description: "PyTorch3D git ref to build (release tag, branch, or commit). Default is v0.7.9, the latest tagged release."
        required: true
        type: string
        default: "v0.7.9"
      python-version:
        description: "Python version"
        required: true
        type: string
        default: "3.12"
      torch-versions:
        description: "JSON list of PyTorch versions to build against"
        required: true
        type: string
        default: '["2.13.0"]'
      cuda-versions:
        description: "JSON list of CUDA toolkit versions to build against"
        required: true
        type: string
        default: '["13.0.0", "13.2.0"]'
      torch-channel:
        description: "Which PyTorch wheel index to install from"
        required: true
        type: choice
        options:
          - stable
          - nightly
        default: stable
      torch-cuda-arch-list:
        description: "CUDA architectures to target (semicolon-separated)"
        required: true
        type: string
        default: "7.5;8.0;8.6;8.9;9.0;10.0;12.0"
      runs-on:
        description: "Windows runner label"
        required: true
        type: string
        default: "windows-2022"
      patch-command:
        description: "Shell command run inside the pytorch3d checkout before building. Defaults to this repo's known-issue patch script. Leave blank to skip patching entirely."
        required: false
        type: string
        default: "bash ../patches/pulsar_patch.sh"
      upload-to-release:
        description: "Upload built wheels to a GitHub release"
        type: boolean
        default: true
      override-previous:
        description: "Overwrite existing release assets with the same name"
        type: boolean
        default: false

defaults:
  run:
    shell: bash

jobs:
  build-pytorch3d:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        cuda-version: ${{ fromJson(inputs.cuda-versions) }}
        torch-version: ${{ fromJson(inputs.torch-versions) }}
    runs-on: ${{ inputs.runs-on }}
    name: Build pytorch3d (torch ${{ matrix.torch-version }}, CUDA ${{ matrix.cuda-version }})
    steps:
      - name: Check out this repo (for patches/ etc.)
        uses: actions/checkout@v4

      - name: Resolve CUDA short tag and release tag for this leg
        id: resolve
        run: |
          CUDA_MAJOR=$(echo "${{ matrix.cuda-version }}" | cut -d. -f1)
          CUDA_MINOR=$(echo "${{ matrix.cuda-version }}" | cut -d. -f2)
          CUDA_SHORT="cu${CUDA_MAJOR}${CUDA_MINOR}"
          echo "CUDA_SHORT=$CUDA_SHORT" >> "$GITHUB_ENV"

          TORCH_MAJOR=$(echo "${{ matrix.torch-version }}" | cut -d. -f1)
          TORCH_MINOR=$(echo "${{ matrix.torch-version }}" | cut -d. -f2)
          TAG="pytorch3d-torch${TORCH_MAJOR}.${TORCH_MINOR}-${CUDA_SHORT}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create release for this leg (if it does not exist)
        if: ${{ inputs.upload-to-release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.resolve.outputs.tag }}" \
            --title "${{ steps.resolve.outputs.tag }}" \
            --notes "PyTorch3D Windows wheels for PyTorch ${{ matrix.torch-version }} + CUDA ${{ matrix.cuda-version }}" \
            --repo "${{ github.repository }}" \
            2>/dev/null || true

      - name: Check if wheel already exists
        id: check
        if: ${{ inputs.upload-to-release && !inputs.override-previous }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=$(gh release view "${{ steps.resolve.outputs.tag }}" --repo "${{ github.repository }}" --json assets -q '.assets[].name' 2>/dev/null || echo "")
          if echo "$ASSETS" | grep -q "^pytorch3d-.*win_amd64"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::pytorch3d wheel already exists in release ${{ steps.resolve.outputs.tag }}, skipping build"
          fi

      - name: Set up Python
        if: ${{ steps.check.outputs.skip != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Enable long paths (helps with deep MSVC/CUDA include trees)
        if: ${{ steps.check.outputs.skip != 'true' }}
        shell: pwsh
        run: |
          git config --system core.longpaths true

      - name: Install CUDA ${{ matrix.cuda-version }}
        if: ${{ steps.check.outputs.skip != 'true' }}
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: ${{ matrix.cuda-version }}
          method: "local"

      - name: Set up MSVC x64 dev environment
        if: ${{ steps.check.outputs.skip != 'true' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Disable Git's link.exe (shadows MSVC's linker under shell:bash)
        if: ${{ steps.check.outputs.skip != 'true' }}
        shell: pwsh
        run: |
          # ilammy/msvc-dev-cmd's own README documents this exact conflict:
          # GitHub Actions unconditionally re-prepends Git for Windows' GNU
          # paths (usr/bin, bin) at the start of EVERY bash step, on top of
          # whatever msvc-dev-cmd set up - so any PATH reordering we do gets
          # silently undone on the very next step. Git's usr/bin/link.exe (a
          # Unix hardlink tool) then gets picked up instead of MSVC's actual
          # linker, which fails on MSVC flags like /LTCG with
          # "extra operand '/LTCG'".
          #
          # The maintainer's own recommended fix is to remove the conflicting
          # binary rather than fight PATH ordering. We rename it instead of
          # deleting, in case anything on the runner legitimately needs it.
          foreach ($p in @(
            "C:\Program Files\Git\usr\bin\link.exe",
            "C:\Program Files\Git\bin\link.exe"
          )) {
            if (Test-Path $p) {
              Rename-Item $p "$p.disabled-by-workflow" -Force
              Write-Host "Renamed $p to prevent shadowing MSVC's link.exe"
            }
          }

      - name: Verify link.exe resolves to MSVC, not Git
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          LINK_PATH=$(command -v link)
          echo "Resolved link.exe: $LINK_PATH"
          case "$LINK_PATH" in
            *Git*) echo "::error::link.exe still resolves to Git's version: $LINK_PATH" && exit 1 ;;
          esac

      - name: Set build environment
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          echo "FORCE_CUDA=1" >> "$GITHUB_ENV"
          echo "DISTUTILS_USE_SDK=1" >> "$GITHUB_ENV"
          echo "TORCH_CUDA_ARCH_LIST=${{ inputs.torch-cuda-arch-list }}" >> "$GITHUB_ENV"
          echo "MAX_JOBS=4" >> "$GITHUB_ENV"
          echo "CUDA_PATH=${{ steps.cuda-toolkit.outputs.CUDA_PATH }}" >> "$GITHUB_ENV"
          # CUDA 13.x's CCCL headers add a hard compile-time check that fails
          # (fatal error C1189) unless MSVC's traditional preprocessor warning
          # is explicitly acknowledged. pytorch3d's setup.py doesn't pass this
          # flag itself (predates CUDA 13), so we inject it globally via the
          # NVCC_APPEND_FLAGS env var, which nvcc appends to every invocation
          # regardless of what the calling build system passes.
          echo "NVCC_APPEND_FLAGS=-DCCCL_IGNORE_MSVC_TRADITIONAL_PREPROCESSOR_WARNING" >> "$GITHUB_ENV"

      - name: Install PyTorch (${{ inputs.torch-channel }}, ${{ env.CUDA_SHORT }})
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          python -m pip install --upgrade pip
          if [ "${{ inputs.torch-channel }}" = "nightly" ]; then
            INDEX_URL="https://download.pytorch.org/whl/nightly/${CUDA_SHORT}"
          else
            INDEX_URL="https://download.pytorch.org/whl/${CUDA_SHORT}"
          fi
          echo "Using index: $INDEX_URL"
          pip install --no-cache-dir "torch==${{ matrix.torch-version }}" --index-url "$INDEX_URL"

      - name: Install build dependencies
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          pip install ninja iopath fvcore wheel setuptools

      - name: Checkout PyTorch3D
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          git clone --depth 1 --branch "${{ inputs.pytorch3d-ref }}" https://github.com/facebookresearch/pytorch3d.git || \
          (git clone https://github.com/facebookresearch/pytorch3d.git && cd pytorch3d && git checkout "${{ inputs.pytorch3d-ref }}")

      - name: Apply optional patch command
        if: ${{ steps.check.outputs.skip != 'true' && inputs.patch-command != '' }}
        working-directory: pytorch3d
        run: ${{ inputs.patch-command }}

      - name: Build wheel
        if: ${{ steps.check.outputs.skip != 'true' }}
        working-directory: pytorch3d
        run: |
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.version.cuda)"
          mkdir -p ../wheels
          # --no-build-isolation is required: setup.py imports torch at build
          # time, and an isolated build env would not have torch installed.
          pip wheel . --no-deps --no-build-isolation -w ../wheels

      - name: Rename wheel to embed CUDA tag as local version
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          python - <<'PY'
          import glob, os

          cuda_short = os.environ["CUDA_SHORT"]

          for path in glob.glob("wheels/pytorch3d-*.whl"):
              stem = os.path.basename(path)[:-4]  # strip ".whl"
              parts = stem.split("-")
              # Standard wheel filename spec:
              # {distribution}-{version}(-{build tag})?-{python tag}-{abi tag}-{platform tag}.whl
              if len(parts) == 5:
                  dist, version, pytag, abitag, plat = parts
              elif len(parts) == 6:
                  dist, version, build, pytag, abitag, plat = parts
                  pytag = f"{build}-{pytag}"
              elif len(parts) == 4:
                  dist, pytag, abitag, plat = parts
                  version = "0"
              else:
                  raise SystemExit(f"Unrecognized wheel filename, leaving as-is: {path}")

              new_version = f"{version}+{cuda_short}"
              new_name = f"{dist}-{new_version}-{pytag}-{abitag}-{plat}.whl"
              new_path = os.path.join("wheels", new_name)
              os.rename(path, new_path)
              print(f"{path} -> {new_path}")
          PY
          ls -la wheels/

      - name: Upload build artifact
        if: ${{ steps.check.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pytorch3d-windows-torch${{ matrix.torch-version }}-${{ env.CUDA_SHORT }}
          path: wheels/*.whl

      - name: Upload wheel to release
        if: ${{ steps.check.outputs.skip != 'true' && inputs.upload-to-release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CLOBBER_FLAG=""
          if [ "${{ inputs.override-previous }}" = "true" ]; then
            CLOBBER_FLAG="--clobber"
          fi
          gh release upload "${{ steps.resolve.outputs.tag }}" wheels/*.whl $CLOBBER_FLAG --repo "${{ github.repository }}" 2>&1 | tee /tmp/upload.log || {
            if grep -q "already exists" /tmp/upload.log; then
              echo "::warning::Wheel already exists in release, skipping upload"
            else
              exit 1
            fi
          }
